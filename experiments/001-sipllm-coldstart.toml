# 001 — llama-cli cold-start baseline.
#
# What: measure how long llama-cli takes to start and exit when asked only to
#       print its help text. This is the "process + libc + static init" floor —
#       any real inference run is bounded below by this.
#
# How to interpret: the wall_sec here is the cold-start overhead you pay on
#       every invocation before a single token of inference is produced. If
#       this is 150ms, no matter how good the engine is, a batched invocation
#       of 10 one-liners pays 1.5s of overhead. Important for interactive UX.
#
# NOTE: file is named *-sipllm-* for git history continuity (prayog 0.1-0.5
#       drove sipllm's llm-engine). As of 0.6.0 the runtime is llama-cli;
#       the experiment measures the same thing, just a different binary.

name        = "llama-cli-coldstart"
description = "llama-cli process start + help print, no model, no inference"
cmd         = "/data/data/com.termux/files/home/llama.cpp/build/bin/llama-cli"
args        = "--help"
